version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opsflow-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-opsflow}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-opsflow_password}
      POSTGRES_DB: opsflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: opsflow-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/opsflow_db
      - DATABASE_USERNAME=${DATABASE_USERNAME:-opsflow}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-opsflow_password}
      - JWT_SECRET=${JWT_SECRET:-8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d}
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: opsflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

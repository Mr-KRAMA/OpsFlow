spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/opsflow_db
    username: ${DB_USER:opsflow}
    password: ${DB_PASS:opsflow123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  h2:
    console:
      enabled: false

server:
  port: 8081
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d}
  expiration: 86400000

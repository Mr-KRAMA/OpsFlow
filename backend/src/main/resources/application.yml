spring:
  application:
    name: backend

  # Default profile: H2 in-memory (no setup needed)
  # For PostgreSQL: run with --spring.profiles.active=postgres
  datasource:
    url: jdbc:h2:mem:opsflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d8a4c8c7d}
  expiration: 86400000
